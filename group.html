<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Groups - RandomConnect</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/top-bar.css">
    <link rel="stylesheet" href="css/group.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="top-bar">

    <a href="index.html" class="logo">
        RandomConnect
    </a>

    <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
        title="Toggle theme"
    >
        ☀️
    </button>

</header>


<main class="group-page">

    <div class="group-auth-card">

        <div class="group-auth-header">

            <div class="group-icon">
                👥
            </div>

            <h1 id="group-form-title">
                Join a Group
            </h1>

            <p id="group-form-description">
                Enter the group code shared with you to join the conversation.
            </p>

        </div>


        <!-- JOIN GROUP -->

        <form
            id="join-group-form"
            class="group-form"
        >

            <label for="group-code">
                Group Code
            </label>

            <input
                type="text"
                id="group-code"
                placeholder="Enter 4-character code"
                maxlength="4"
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="group-submit-btn"
            >
                Join Group
            </button>

        </form>


        <!-- CREATE GROUP -->

        <form
            id="create-group-form"
            class="group-form"
            style="display: none;"
        >

            <label for="group-name">
                Group Name
            </label>

            <input
                type="text"
                id="group-name"
                placeholder="Enter a group name"
                maxlength="50"
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="group-submit-btn"
            >
                Create Group
            </button>

        </form>


        <!-- RESULT / ERROR -->

        <div
            id="group-result"
            class="group-result"
        ></div>


        <!-- SWITCH -->

        <div class="group-switch">

            <p id="group-switch-text">
                Don't have a group?
            </p>

            <button
                type="button"
                id="group-switch-btn"
                class="group-switch-btn"
            >
                Create a Group
            </button>

        </div>

    </div>

</main>





<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/groups.js"></script>

</body>

</html>
