<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Chat - RandomConnect</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/top-bar.css">
    <link rel="stylesheet" href="css/group-chat.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>




<header class="top-bar">
    <a href="index.html" class="logo">RandomConnect</a>

    <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
        title="Toggle theme"
    >
        ☀️
    </button>
</header>



<!-- =========================
     GROUP CHAT
========================= -->

<main class="page">


    <!-- CHAT HEADER -->

    <div class="chat-header">


        <div class="chat-header-left">


            <div class="chat-icon">
                👥
            </div>


            <div>

                <h1 id="group-title">
                    Loading...
                </h1>


                <p class="group-code">
                    Code:
                    <strong id="group-code">
                        ...
                    </strong>
                </p>

            </div>


        </div>



        <div class="chat-header-right">

            <div id="group-chat-status">
                Connecting...
            </div>


            <div class="chat-online-description">
                Real-time group chat
            </div>

        </div>


    </div>



    <!-- =========================
         CHAT BODY
    ========================== -->

    <div class="group-chat-body">


        <!-- MESSAGES -->

        <div id="group-messages">

            <div
                id="empty-message"
                class="empty"
            >
                No messages yet.<br>
                Start the conversation.
            </div>

        </div>



        <!-- MESSAGE INPUT -->

        <form
            id="group-message-form"
        >

            <input
                type="text"
                id="group-message-input"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="5000"
            >


            <button
                type="submit"
                id="send-button"
            >
                ➤ Send
            </button>

        </form>


    </div>



    <!-- =========================
         LEAVE GROUP
    ========================== -->

    <div class="chat-actions">

        <button
            id="group-leave"
            type="button"
        >
            🚪 Leave Group
        </button>

    </div>


</main>



<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/theme.js"></script>
<script src="js/group-chat.js"></script>


</body>

</html>
