<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Chat - RandomConnect</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <nav>

        <a
            href="index.html"
            class="logo"
        >
            RandomConnect
        </a>


        <ul>

            <li>
                <a href="index.html">
                    🏠 Home
                </a>
            </li>

            <li>
                <a href="group.html">
                    👥 Groups
                </a>
            </li>

            <li>
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                >
                    🌙 Dark
                </button>
            </li>

        </ul>

    </nav>

</header>


<main class="page">


    <div class="chat-header">

        <div>

            <h1 id="group-title">
                Loading...
            </h1>

            <p>
                Code:
                <strong id="group-code">
                    ...
                </strong>
            </p>

        </div>


        <div
            id="group-chat-status"
            class="status"
        >
            Connecting...
        </div>

    </div>


    <div class="chat-body">


        <div
            id="group-messages"
            class="messages"
        >

            <div
                id="empty-message"
                class="empty"
            >
                No messages yet.<br>
                Start the conversation.
            </div>

        </div>


        <form
            id="group-message-form"
            class="message-form"
        >

            <input
                type="text"
                id="group-message-input"
                class="message-input"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="5000"
            >

            <button
                type="submit"
                id="send-button"
                class="send-button"
                disabled
            >
                Send
            </button>

        </form>


    </div>


    <div class="chat-actions">

        <button
            id="group-leave"
            class="leave-button"
            type="button"
        >
            Leave Group
        </button>

    </div>


</main>


<script src="script.js"></script>

</body>

</html>
