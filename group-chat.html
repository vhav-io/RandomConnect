<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Chat - RandomConnect</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header>

    <nav>

        <a
            href="index.html"
            class="logo"
        >
            RandomConnect
        </a>


        <ul>

            <li>
                <a href="index.html">
                    🏠 Home
                </a>
            </li>


            <li>
                <a href="group.html">
                    👥 Groups
                </a>
            </li>


            <li>
                <button
                    id="theme-toggle"
                    class="theme-toggle"
                    type="button"
                >
                    🌙 Dark
                </button>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================
     GROUP CHAT
========================= -->

<main class="page">


    <!-- CHAT HEADER -->

    <div class="chat-header">


        <div class="chat-header-left">


            <div class="chat-icon">
                👥
            </div>


            <div>

                <h1 id="group-title">
                    Loading...
                </h1>


                <p class="group-code">
                    Code:
                    <strong id="group-code">
                        ...
                    </strong>
                </p>

            </div>


        </div>



        <div class="chat-header-right">

            <div id="group-chat-status">
                Connecting...
            </div>


            <div class="chat-online-description">
                Real-time group chat
            </div>

        </div>


    </div>



    <!-- =========================
         CHAT BODY
    ========================== -->

    <div class="group-chat-body">


        <!-- MESSAGES -->

        <div id="group-messages">

            <div
                id="empty-message"
                class="empty"
            >
                No messages yet.<br>
                Start the conversation.
            </div>

        </div>



        <!-- MESSAGE INPUT -->

        <form
            id="group-message-form"
        >

            <input
                type="text"
                id="group-message-input"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="5000"
            >


            <button
                type="submit"
                id="send-button"
            >
                ➤ Send
            </button>

        </form>


    </div>



    <!-- =========================
         LEAVE GROUP
    ========================== -->

    <div class="chat-actions">

        <button
            id="group-leave"
            type="button"
        >
            🚪 Leave Group
        </button>

    </div>


</main>



<script src="script.js"></script>


</body>

</html>
