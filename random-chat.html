<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Random Chat - RandomConnect</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/top-bar.css">
    <link rel="stylesheet" href="css/random-chat.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>


<body>

    <header class="top-bar">
        <a href="index.html" class="logo">RandomConnect</a>

        <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            ☀️
        </button>
    </header>


    <main>

        <section class="chat-page">

            <div class="chat-container">


                <!-- CHAT HEADER -->

                <div class="chat-header">

                    <div class="chat-header-left">

                        <div class="chat-icon">
                            💬
                        </div>


                        <div>

                            <h1>
                                Random Chat
                            </h1>

                            <p id="chat-description">
                                Connect with someone new anonymously.
                            </p>

                        </div>

                    </div>


                    <div class="chat-header-right">

                        <div class="chat-online">

                            <span class="online-dot"></span>

                            <span id="chat-status">
                                Finding someone...
                            </span>

                        </div>


                        <div class="chat-online-description">
                            Anonymous chat
                        </div>

                    </div>

                </div>


                <!-- =========================
                     CHAT AREA
                ========================== -->

                <div class="chat-area">


                    <!-- MATCHING -->

                    <div
                        class="matching-screen"
                        id="matching-screen"
                    >

                        <div class="matching-icon">
                            🔎
                        </div>

                        <div class="matching-circle"></div>

                        <h2>
                            Looking for someone to chat with
                        </h2>

                        <p id="matching-description">
                            Please wait while we find another person.
                        </p>

                    </div>


                    <!-- =========================
                         CONVERSATION
                    ========================== -->

                    <div
                        class="conversation"
                        id="conversation"
                    >


                        <div
                            class="messages"
                            id="messages"
                        >

                        </div>


                        <form
                            class="message-form"
                            id="message-form"
                        >

                            <input
                                type="text"
                                id="message-input"
                                placeholder="Type a message..."
                                autocomplete="off"
                                maxlength="5000"
                            >


                            <button
                                type="submit"
                            >
                                ➤ Send
                            </button>

                        </form>


                    </div>

                </div>


                <!-- =========================
                     ACTIONS
                ========================== -->

                <div class="chat-actions">


                    <button
                        type="button"
                        class="chat-btn"
                        id="skip-btn"
                    >
                        ⏭️ Skip
                    </button>


                    <button
                        type="button"
                        class="chat-btn secondary-btn"
                        id="leave-chat"
                    >
                        🚪 Leave Chat
                    </button>


                    <!-- Kept for compatibility
                         with your current JS -->

                    <button
                        type="button"
                        class="chat-btn secondary-btn"
                        id="chat-action-btn"
                        style="display: none;"
                    >
                        Cancel
                    </button>


                </div>


            </div>

        </section>

    </main>


    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/random-chat.js"></script>

</body>

</html>
